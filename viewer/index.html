<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>paper-lineage</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; color: #d7dae2;
               font: 12px/1.5 -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; }
  /* canvas は置換要素なので inset:0 だけでは伸びず、width/height 属性(描画バッファ)が
     CSS サイズとして使われてしまう。毎フレーム dpr 倍に膨らむので必ず CSS で固定する。 */
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh;
            display: block; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }

  .panel { position: fixed; background: rgba(12,14,20,.88); backdrop-filter: blur(8px);
           border: 1px solid #232734; border-radius: 8px; padding: 10px 12px; }
  #controls { top: 12px; left: 12px; width: 252px; }
  #controls h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { flex: 0 0 74px; color: #8b91a3; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; color: #aab; }
  #stats { color: #6d7488; margin-top: 8px; font-size: 11px; }

  #search { width: 100%; box-sizing: border-box; background: #0d0f16; color: #d7dae2;
            border: 1px solid #2b3142; border-radius: 5px; padding: 5px 7px; font: inherit;
            margin-bottom: 4px; }
  #search:focus { outline: none; border-color: #4a5473; }
  #searchResults { max-height: 190px; overflow-y: auto; margin-bottom: 4px; }
  #searchResults div { padding: 3px 0; border-top: 1px solid #1c2029; color: #aab2c4;
                       cursor: pointer; font-size: 11px; }
  #searchResults div:hover { color: #fff; }
  #searchResults .y { color: #6d7488; font-variant-numeric: tabular-nums; margin-right: 5px; }
  #searchResults .count { color: #6d7488; border: 0; cursor: default; }
  .hint { color: #5d6478; font-size: 11px; margin-top: 6px; }

  #legend { bottom: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 420px; }
  #legend span { display: flex; align-items: center; gap: 4px; color: #98a; }
  #legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  #tooltip { position: fixed; pointer-events: none; max-width: 380px; display: none;
             border-color: #31384a; z-index: 5; }
  #tooltip .t { color: #eef; margin-bottom: 4px; }
  #tooltip .m { color: #7f879b; }

  /* 選択した論文の系譜パネル */
  #lineage { top: 12px; right: 12px; width: 320px; display: none; max-height: calc(100vh - 24px);
             overflow-y: auto; }
  #lineage h2 { margin: 0 0 2px; font-size: 12px; color: #eef; font-weight: 600; }
  #lineage .meta { color: #7f879b; margin-bottom: 8px; }
  #lineage .counts { display: flex; gap: 10px; margin-bottom: 8px; }
  #lineage .counts b { font-variant-numeric: tabular-nums; }
  #lineage .up b { color: #4fd2c2; }
  #lineage .down b { color: #ff9a52; }
  #lineage .close { float: right; cursor: pointer; color: #6d7488; }
  #lineage .close:hover { color: #ccd; }
  #lineage ol { margin: 6px 0 0; padding-left: 0; list-style: none; }
  #lineage li { padding: 3px 0; border-top: 1px solid #1c2029; color: #aab2c4; cursor: pointer; }
  #lineage li:hover { color: #fff; }
  #lineage li .y { color: #6d7488; font-variant-numeric: tabular-nums; margin-right: 6px; }
  #lineage h3 { font-size: 11px; color: #8b91a3; margin: 12px 0 0; font-weight: 500; }

  #axis { position: fixed; bottom: 0; left: 0; right: 0; height: 22px; pointer-events: none;
          font-variant-numeric: tabular-nums; color: #5d6478; }
  #axis div { position: absolute; transform: translateX(-50%); }

  /* 帯(コミュニティ)の境界とラベル */
  #bands { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #bands .sep { position: absolute; left: 0; right: 0; height: 1px; background: #ffffff10; }
  #bands .lbl { position: absolute; right: 8px; max-width: 46vw; color: #7b8398; font-size: 11px;
                text-align: right; text-shadow: 0 0 6px #000, 0 0 3px #000;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* サブ帯(帯の中のサブ分野)は薄く。拡大したときだけ出る。 */
  #bands .sep.sub { background: #ffffff08; }
  #bands .lbl.sub { color: #5d6478; font-size: 10px; right: 14px; }

  #lineage ol.trends { margin: 4px 0 0; }
  #lineage li.trend { position: relative; border-top: 1px solid #1c2029; cursor: default;
                      padding: 4px 0 4px 34px; font-size: 11px; overflow: hidden; }
  #lineage li.trend .n { position: absolute; left: 0; color: #8b91a3;
                         font-variant-numeric: tabular-nums; }
  #lineage li.trend .bar { position: absolute; left: 34px; bottom: 0; height: 2px; border-radius: 1px; }
  #lineage li.trend.up .bar { background: #4fd2c2; }
  #lineage li.trend.down .bar { background: #ff9a52; }
  body.has-selection #bands { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls" class="panel">
  <h1>paper-lineage</h1>
  <input id="search" type="search" placeholder="タイトル検索(Enter で先頭を選択)" autocomplete="off">
  <div id="searchResults"></div>
  <div class="row">
    <label>幹のみ</label>
    <input id="thresh" type="range" min="0" max="1" step="0.005" value="0">
    <span class="val" id="threshVal">全部</span>
  </div>
  <div class="row">
    <label>線の濃さ</label>
    <input id="alpha" type="range" min="0.005" max="0.6" step="0.005" value="0.05">
    <span class="val" id="alphaVal">.05</span>
  </div>
  <div class="row">
    <label>露出</label>
    <input id="exposure" type="range" min="1" max="400" step="1" value="60">
    <span class="val" id="exposureVal">60</span>
  </div>
  <div class="row">
    <label>ガンマ</label>
    <input id="gamma" type="range" min="0.4" max="2.5" step="0.05" value="1">
    <span class="val" id="gammaVal">1.00</span>
  </div>
  <div class="row">
    <label>点の大きさ</label>
    <input id="psize" type="range" min="0.5" max="8" step="0.1" value="0.8">
    <span class="val" id="psizeVal">0.8</span>
  </div>
  <div class="row">
    <label>系譜の深さ</label>
    <!-- 既定は 2 ホップ。無制限だと数千本が塗り潰されて「系譜」として読めなくなる。 -->
    <input id="depth" type="range" min="1" max="9" step="1" value="2">
    <span class="val" id="depthVal">2ホップ</span>
  </div>
  <div class="row">
    <label>系譜のみ</label>
    <input id="only" type="checkbox">
    <span class="val"></span>
  </div>
  <div id="stats">読み込み中…</div>
  <div class="hint">論文をクリックすると系譜を表示 / ドラッグで移動 / ホイールで拡大</div>
</div>

<div id="legend" class="panel"></div>
<div id="tooltip" class="panel"></div>

<div id="lineage" class="panel">
  <span class="close" id="lineageClose">×</span>
  <h2 id="selTitle"></h2>
  <div class="meta" id="selMeta"></div>
  <div class="counts">
    <span class="up">遡る系譜 <b id="upCount">0</b></span>
    <span class="down">その後 <b id="downCount">0</b></span>
  </div>
  <div id="lineageLists"></div>
</div>

<div id="bands"></div>
<div id="axis"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
