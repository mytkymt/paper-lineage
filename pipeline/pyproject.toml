[project]
name = "paperlineage-pipeline"
version = "0.1.0"
description = "Offline pipeline: fetch HCI corpus, build citation DAG, compute main paths"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlineage"]
